name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [windows-latest, macOS-latest, ubuntu-latest]
                node-version: [24.x]
                deno-version: [2.x]

        steps:
            - uses: actions/checkout@v6

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Set up Deno ${{ matrix.deno-version }}
              uses: denoland/setup-deno@v2
              with:
                  deno-version: ${{ matrix.deno-version }}

            - name: npm install
              run: npm install

            - name: Install Playwright browsers (Linux)
              if: runner.os == 'Linux'
              run: npm exec --workspace @humanfs/web -- playwright install --with-deps chromium firefox

            - name: Install Playwright browsers
              if: runner.os != 'Linux'
              run: npm exec --workspace @humanfs/web -- playwright install chromium firefox

            - name: Test
              run: npm test
              env:
                  CI: true
